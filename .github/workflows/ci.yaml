name: Code Quality and API Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Validate OpenAPI Specification
        uses: pb33f/openapi-changes-action@v1
        continue-on-error: true
